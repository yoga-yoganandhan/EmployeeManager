spring.application.name=emp

spring.datasource.url=jdbc:postgresql://localhost:5432/employee
spring.datasource.username=postgres
spring.datasource.password=347504

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable Hibernate schema modification (Flyway manages this now)
spring.jpa.hibernate.ddl-auto=none

# Enable basic HTTP pop-up security authentication
spring.security.user.name=admin
spring.security.user.password=admin123

# Enable Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
